name: deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - run: pnpm test:nobuild

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
