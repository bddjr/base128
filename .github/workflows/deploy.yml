name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - run: pnpm test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - run: deno run test:deno

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun test:bun

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: test
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
