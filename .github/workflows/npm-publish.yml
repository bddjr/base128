name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-binding:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            continue-on-error: true
          - os: windows-latest
            name: win32-x64
          - os: macos-latest
            name: darwin-arm64
          - os: macos-13
            name: darwin-x64
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12"

      - run: pnpm i

      - name: Build native addon
        run: pnpm run build

      - name: Test
        run: pnpm test:nobuild

      - name: Prepare subpackage (${{ matrix.name }})
        run: node scripts/prepare-subpackage.mjs ${{ matrix.name }}

      - name: Upload binding (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.name }}
          path: npm/${{ matrix.name }}/

  publish-npm:
    needs: [build-binding]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC / npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12"

      - run: pnpm i

      - name: Download all bindings
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: downloaded-bindings

      - name: Display downloaded bindings
        run: ls -R downloaded-bindings

      - name: Publish all packages
        run: node scripts/publish-all.mjs downloaded-bindings
