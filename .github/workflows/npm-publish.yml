name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-npm:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC / npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          pattern: binding-*
          path: downloaded-bindings

      - name: Display downloaded bindings
        run: ls -R downloaded-bindings

      - name: Publish all packages
        run: node scripts/publish-all.mjs downloaded-bindings
