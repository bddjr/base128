name: build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-native:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-gnu
          - os: ubuntu-24.04-arm
            name: linux-arm64-gnu
          - os: windows-latest
            name: win32-x64-msvc
          - os: windows-11-arm
            name: win32-arm64-msvc
          - os: macos-latest
            name: darwin-arm64
          - os: macos-15-intel
            name: darwin-x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - run: pnpm test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - run: deno run test:deno

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun test:bun

      - name: Prepare subpackage (${{ matrix.name }})
        run: node scripts/prepare-subpackage.mjs ${{ matrix.name }}

      - name: Upload binding (${{ matrix.name }})
        uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.name }}
          path: npm/${{ matrix.name }}/

  build-container:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-musl
            image: node:lts-alpine
            platform: linux/amd64
            pkg_cmd: apk add --no-cache python3 make g++
          - os: ubuntu-24.04-arm
            name: linux-arm64-musl
            image: node:lts-alpine
            platform: linux/arm64
            pkg_cmd: apk add --no-cache python3 make g++
          - os: ubuntu-latest
            name: linux-ppc64-gnu
            image: node:lts-bookworm-slim
            platform: linux/ppc64le
            pkg_cmd: apt-get update && apt-get install -y python3 make g++
            qemu: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - name: Build in Docker container
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD":/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            sh -e -c "
              ${{ matrix.pkg_cmd }}
              npm install -g pnpm --no-ignore-scripts
              pnpm i
              pnpm test
              node scripts/prepare-subpackage.mjs ${{ matrix.name }}
              chmod -R 777 npm
            "

      - name: Upload binding (${{ matrix.name }})
        uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.name }}
          path: npm/${{ matrix.name }}/

  build-freebsd:
    name: build (freebsd-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start VM
        uses: cross-platform-actions/action@v1
        with:
          operating_system: freebsd
          version: "14.0"
          shell: bash

      - name: Setup
        shell: cpa.sh {0}
        run: |
          sudo pkg install -y node npm python3
          sudo npm install -g pnpm --no-ignore-scripts
          pnpm i

      - shell: cpa.sh {0}
        run: pnpm test

      - name: Prepare subpackage freebsd-x64
        shell: cpa.sh {0}
        run: node scripts/prepare-subpackage.mjs freebsd-x64

      - name: Upload binding (freebsd-x64)
        uses: actions/upload-artifact@v7
        with:
          name: binding-freebsd-x64
          path: npm/freebsd-x64/

  build-android:
    name: build (android-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - name: Build Android binding
        run: |
          TOOLCHAIN_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN_BIN/aarch64-linux-android24-clang++"
          $CXX -O3 -flto -fomit-frame-pointer -fno-rtti -fvisibility=hidden -fPIC -shared -std=c++17 -DNAPI_DISABLE_CPP_EXCEPTIONS \
            -I node_modules/node-api-headers/include \
            -I node_modules/node-addon-api \
            -Wl,-z,undefs \
            src-napi/addon.cpp -o npm/android-arm64/napi.node
          $TOOLCHAIN_BIN/llvm-strip --strip-all npm/android-arm64/napi.node
          node scripts/prepare-subpackage.mjs android-arm64 npm/android-arm64/napi.node

      - name: Upload binding (android-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: binding-android-arm64
          path: npm/android-arm64/

  build-openharmony:
    name: build (openharmony-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1

      - name: Build OpenHarmony binding
        run: |
          CXX="$OHOS_SDK_NATIVE/llvm/bin/clang++"
          $CXX --target=aarch64-linux-ohos --sysroot="$OHOS_SDK_NATIVE/sysroot" \
            -O3 -flto -fomit-frame-pointer -fno-rtti -fvisibility=hidden -fPIC -shared -std=c++17 -DNAPI_DISABLE_CPP_EXCEPTIONS \
            -I node_modules/node-api-headers/include \
            -I node_modules/node-addon-api \
            -Wl,-z,undefs \
            src-napi/addon.cpp -o npm/openharmony-arm64/napi.node
          $OHOS_SDK_NATIVE/llvm/bin/llvm-strip --strip-all npm/openharmony-arm64/napi.node
          node scripts/prepare-subpackage.mjs openharmony-arm64 npm/openharmony-arm64/napi.node

      - name: Upload binding (openharmony-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: binding-openharmony-arm64
          path: npm/openharmony-arm64/
