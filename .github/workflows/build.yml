name: build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-native:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-gnu
          - os: ubuntu-24.04-arm
            name: linux-arm64-gnu
          - os: windows-latest
            name: win32-x64-msvc
          - os: windows-latest
            name: win32-arm64-msvc
            arch: arm64
          - os: macos-latest
            name: darwin-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - run: pnpm run check

      - name: Build native addon
        shell: bash
        run: |
          if [ -n "${{ matrix.arch }}" ]; then
            pnpm exec node-gyp rebuild --arch=${{ matrix.arch }}
          else
            pnpm build
          fi

      - name: Test
        if: ${{ !matrix.arch }}
        run: pnpm test:only

      - name: Prepare subpackage (${{ matrix.name }})
        run: node scripts/prepare-subpackage.mjs ${{ matrix.name }}

      - name: Upload binding (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.name }}
          path: npm/${{ matrix.name }}/

  build-darwin-x64:
    name: build (darwin-x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          architecture: x64

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          node-version-file: false
          install: true

      - run: pnpm run check

      - name: Build native addon
        run: pnpm run build

      - name: Test
        run: pnpm test:only

      - name: Prepare subpackage (darwin-x64)
        run: node scripts/prepare-subpackage.mjs darwin-x64

      - name: Upload binding (darwin-x64)
        uses: actions/upload-artifact@v4
        with:
          name: binding-darwin-x64
          path: npm/darwin-x64/

  build-container:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-musl
            image: node:lts-alpine
            platform: linux/amd64
            pkg_cmd: apk add --no-cache python3 make g++
          - name: linux-arm64-musl
            image: node:lts-alpine
            platform: linux/arm64
            pkg_cmd: apk add --no-cache python3 make g++
            qemu: true
          - name: linux-ppc64-gnu
            image: node:lts-bookworm-slim
            platform: linux/ppc64le
            pkg_cmd: apt-get update && apt-get install -y python3 make g++
            qemu: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Build in Docker container
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD":/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            sh -e -c "
              ${{ matrix.pkg_cmd }}
              npm install -g pnpm --no-ignore-scripts
              pnpm i
              pnpm test
              node scripts/prepare-subpackage.mjs ${{ matrix.name }}
              chmod -R 777 npm
            "

      - name: Upload binding (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.name }}
          path: npm/${{ matrix.name }}/

  build-freebsd:
    name: build (freebsd-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build in FreeBSD VM
        uses: cross-platform-actions/action@v0.26.0
        with:
          operating_system: freebsd
          version: "14.0"
          shell: bash
          run: |
            sudo pkg install -y node npm python3
            sudo npm install -g pnpm --no-ignore-scripts
            pnpm i
            pnpm test
            node scripts/prepare-subpackage.mjs freebsd-x64

      - name: Upload binding (freebsd-x64)
        uses: actions/upload-artifact@v4
        with:
          name: binding-freebsd-x64
          path: npm/freebsd-x64/

  build-android:
    name: build (android-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - name: Build Android binding
        run: |
          TOOLCHAIN_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN_BIN/aarch64-linux-android24-clang++"
          $CXX -O3 -flto -fomit-frame-pointer -fno-rtti -fvisibility=hidden -fPIC -shared -std=c++17 -DNAPI_DISABLE_CPP_EXCEPTIONS \
            -I node_modules/node-api-headers/include \
            -I node_modules/node-addon-api \
            -Wl,-z,undefs \
            src-napi/addon.cpp -o npm/android-arm64/napi.node
          $TOOLCHAIN_BIN/llvm-strip --strip-all npm/android-arm64/napi.node
          node scripts/prepare-subpackage.mjs android-arm64 npm/android-arm64/napi.node

      - name: Upload binding (android-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: binding-android-arm64
          path: npm/android-arm64/

  build-openharmony:
    name: build (openharmony-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1

      - name: Build OpenHarmony binding
        run: |
          CXX="$OHOS_SDK_NATIVE/llvm/bin/clang++"
          $CXX --target=aarch64-linux-ohos --sysroot="$OHOS_SDK_NATIVE/sysroot" \
            -O3 -flto -fomit-frame-pointer -fno-rtti -fvisibility=hidden -fPIC -shared -std=c++17 -DNAPI_DISABLE_CPP_EXCEPTIONS \
            -I node_modules/node-api-headers/include \
            -I node_modules/node-addon-api \
            -Wl,-z,undefs \
            src-napi/addon.cpp -o npm/openharmony-arm64/napi.node
          $OHOS_SDK_NATIVE/llvm/bin/llvm-strip --strip-all npm/openharmony-arm64/napi.node
          node scripts/prepare-subpackage.mjs openharmony-arm64 npm/openharmony-arm64/napi.node

      - name: Upload binding (openharmony-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: binding-openharmony-arm64
          path: npm/openharmony-arm64/
